name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets e2e-nightly.yml run the same two jobs as part of the nightly run and
  # read each job's result for its email.
  workflow_call:
    outputs:
      backend_result:
        value: ${{ jobs.backend.result }}
      frontend_result:
        value: ${{ jobs.frontend.result }}

# Cancel superseded runs on the same PR branch; never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Two .pyc files are tracked by mistake; don't let CI rewrite them either.
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BackEnd
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brrrr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brrrr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Render pins 3.11.9 via runtime.txt; CI tracks the 3.11 line so a
          # runner-image update can't break CI on a missing patch release.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BackEnd/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Importing `main` runs bootstrap.run(): create_all + the Postgres-only
      # migrations (under the advisory lock) + seeding. The second import in a
      # fresh process must find everything already done and be a no-op.
      - name: Postgres migration smoke (boot app twice against fresh Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/brrrr_ci
        run: |
          echo "::group::First boot (empty database)"
          python -c "import main"
          echo "::endgroup::"
          echo "::group::Second boot (already migrated, must be a no-op)"
          python -c "import main"
          echo "::endgroup::"

      # tests/conftest.py forces a throwaway SQLite file and aborts if it ever
      # sees Postgres, so DATABASE_URL is deliberately NOT set on this step.
      - name: Run pytest
        run: pytest -ra

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      # `vue-tsc -b && vite build` is the only type-check in the repo.
      - name: Type-check and build
        run: npm run build
