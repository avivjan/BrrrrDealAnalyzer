name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets e2e-nightly.yml run the same two jobs as part of the nightly run and
  # read each job's result for its email.
  workflow_call:
    inputs:
      upload_reports:
        description: Upload JUnit XML and coverage summaries as run artifacts (the nightly email reads them)
        type: boolean
        default: false
    outputs:
      backend_result:
        value: ${{ jobs.backend.result }}
      frontend_result:
        value: ${{ jobs.frontend.result }}

# Cancel superseded runs on the same PR branch; never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Two .pyc files are tracked by mistake; don't let CI rewrite them either.
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BackEnd
    # Throwaway PostgreSQL for this job only, mirroring
    # BackEnd/docker-compose.test.yml: same user, password and `_test` database
    # name that tests/conftest.py insists on.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brrrr_test
          POSTGRES_PASSWORD: brrrr_test
          POSTGRES_DB: brrrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brrrr_test -d brrrr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Render pins 3.11.9 via runtime.txt; CI tracks the 3.11 line so a
          # runner-image update can't break CI on a missing patch release.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BackEnd/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Importing `main` runs bootstrap.run(): create_all + the Postgres-only
      # migrations (under the advisory lock) + seeding. The second import in a
      # fresh process must find everything already done and be a no-op.
      - name: Postgres migration smoke (boot app twice against fresh Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://brrrr_test:brrrr_test@localhost:5432/brrrr_test
        run: |
          echo "::group::First boot (empty database)"
          python -c "import main"
          echo "::endgroup::"
          echo "::group::Second boot (already migrated, must be a no-op)"
          python -c "import main"
          echo "::endgroup::"

      # tests/conftest.py only reads TEST_DATABASE_URL (never DATABASE_URL),
      # verifies it is PostgreSQL on a loopback host with a `_test` database,
      # and drops/recreates the schema before the suite runs.
      # Plain `pytest` discovers every tests/test_*.py, the MCP server files
      # (test_mcp*.py, one of which boots a real uvicorn) included; a new test
      # file never needs an edit here. The nightly email breaks the MCP tests
      # out of this one JUnit file by module name.
      # JUnit XML + coverage JSON go to the runner's temp dir (never the checkout);
      # the nightly workflow uploads them for its email.
      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://brrrr_test:brrrr_test@localhost:5432/brrrr_test
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          pytest -ra \
            --junitxml="$RUNNER_TEMP/reports/backend-junit.xml" \
            --cov=. --cov-config=../.github/nightly/coveragerc \
            --cov-report=json:"$RUNNER_TEMP/reports/backend-coverage.json" \
            --cov-report=term:skip-covered

      - name: Nightly email package unit tests
        run: python3 -m unittest discover -s ../.github/scripts/nightly/tests -t ../.github/scripts

      - name: Upload backend reports
        if: always() && inputs.upload_reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-${{ github.run_number }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `--reporter` replaces vitest's defaults, so the GitHub annotations reporter
      # is re-added explicitly. JUnit + coverage summary go to the runner's temp dir.
      - name: Run vitest
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          npm test -- --reporter=default --reporter=github-actions --reporter=junit \
            --outputFile.junit="$RUNNER_TEMP/reports/frontend-junit.xml" \
            --coverage.enabled --coverage.provider=v8 --coverage.reporter=json-summary \
            --coverage.reportsDirectory="$RUNNER_TEMP/reports/frontend-coverage"

      - name: Upload frontend reports
        if: always() && inputs.upload_reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend-${{ github.run_number }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # `vue-tsc -b && vite build` is the only type-check in the repo.
      - name: Type-check and build
        run: npm run build
