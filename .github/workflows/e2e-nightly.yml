name: Nightly e2e

on:
  schedule:
    # Midnight in Israel. GitHub cron is UTC-only and cannot follow DST, so
    # both candidate hours are scheduled (21:xx UTC in summer, 22:xx UTC in
    # winter) and the `gate` job lets only the one that matches Israel's
    # current UTC offset continue; the other is skipped. Minute 7 rather than
    # 0 because the top of the hour is GitHub's most contended slot and runs
    # scheduled there start an hour or two late.
    - cron: "7 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    name: Midnight in Israel?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub starts scheduled runs late, often by 1-2 hours, so the wall
          # clock cannot tell us which cron this is. The event does: pick the
          # cron that is midnight for Israel's current UTC offset.
          schedule="${{ github.event.schedule }}"
          offset=$(TZ=Asia/Jerusalem date +%z)   # +0300 in summer, +0200 in winter
          echo "schedule=$schedule offset=$offset israel=$(TZ=Asia/Jerusalem date)"
          case "$schedule/$offset" in
            "7 21 * * */+0300"|"7 22 * * */+0200")
              echo "This cron is midnight in Israel: proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Not this cron: the other scheduled hour is midnight in Israel."
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # The same backend + frontend jobs that gate every PR (.github/workflows/ci.yml).
  ci:
    name: CI suites
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      upload_reports: true

  playwright:
    name: Playwright (all browsers)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      exit_code: ${{ steps.e2e.outputs.exit_code }}
    defaults:
      run:
        working-directory: frontend
    # The FastAPI server Playwright talks to (e2e/backend/serve_throwaway.py)
    # runs on the same throwaway PostgreSQL as the backend tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brrrr_test
          POSTGRES_PASSWORD: brrrr_test
          POSTGRES_DB: brrrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brrrr_test -d brrrr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The suite's webServer starts the real FastAPI app against the job's
      # throwaway PostgreSQL service (e2e/backend/serve_throwaway.py), so the
      # backend deps have to be installed on the runner too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BackEnd/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../BackEnd/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # chromium covers the chromium / Mobile Chrome / chromium-motion
      # projects; webkit covers webkit / Mobile Safari. --with-deps pulls the
      # Linux system libraries WebKit needs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The exit code is recorded for the email, then re-raised so the job
      # still fails on any failing test.
      - name: Run Playwright
        id: e2e
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://brrrr_test:brrrr_test@localhost:5432/brrrr_test
        run: |
          set +e
          npm run e2e
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            frontend/playwright-report
            frontend/e2e/reports/last-run.json
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Behavioural probe of the MCP connector: asks Claude, through the Anthropic API
  # with the connector attached, the question a regular chat once failed on, and
  # checks that the compact deal tools were used. Skips cleanly (result=skipped)
  # unless the ANTHROPIC_API_KEY and MCP_PROBE_URL repository secrets exist.
  mcp-probe:
    name: MCP connector probe
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.probe.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Anthropic SDK
        run: pip install "anthropic>=1,<3"
      - name: Ask Claude through the connector
        id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MCP_PROBE_URL: ${{ secrets.MCP_PROBE_URL }}
        run: |
          set +e
          out=$(python3 .github/scripts/mcp_probe.py 2>&1); code=$?
          echo "$out"
          if printf '%s' "$out" | grep -q '^SKIP'; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit "$code"

  # Sent from the runner over Gmail SMTP once every job above has finished,
  # pass or fail. Needs two repository secrets: NIGHTLY_MAIL_USERNAME (the
  # Gmail address) and NIGHTLY_MAIL_PASSWORD (a Gmail app password for it).
  notify:
    name: Email the result
    needs: [gate, ci, playwright, mcp-probe]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Only this job may write, and only to the `nightly-history` branch (see the push step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Absent when a job died before producing anything; the email says so instead.
      - name: Download the Playwright JSON report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_number }}
          path: artifact
      - name: Download backend reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: junit-backend-${{ github.run_number }}
          path: artifact/backend
      - name: Download frontend reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: junit-frontend-${{ github.run_number }}
          path: artifact/frontend

      # One JSON record per run lives on the orphan branch `nightly-history`.
      - name: Check out nightly-history (or start it)
        run: |
          if git fetch --depth=100 origin nightly-history; then
            git worktree add history FETCH_HEAD
            git -C history checkout -q -B nightly-history
          else
            git worktree add --detach history
            git -C history checkout -q --orphan nightly-history
            git -C history rm -rfq . || true
            printf '# nightly-history\n\nAppend-only records of the nightly test runs, one JSON line per run, read by\n`.github/scripts/nightly/` on main to draw trends. Not meant for humans.\n' > history/README.md
          fi
          touch history/history.jsonl
          echo "history has $(wc -l < history/history.jsonl) record(s)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/nightly/requirements.txt
      - name: Install chart dependency
        continue-on-error: true   # the email falls back to a table without it
        run: pip install -r .github/nightly/requirements.txt

      - name: Build and send the email
        env:
          CI_OUTCOME: ${{ needs.ci.result }}
          BACKEND_OUTCOME: ${{ needs.ci.outputs.backend_result }}
          FRONTEND_OUTCOME: ${{ needs.ci.outputs.frontend_result }}
          MCP_PROBE_OUTCOME: ${{ needs.mcp-probe.outputs.result }}
          E2E_OUTCOME: ${{ needs.playwright.result }}
          E2E_EXIT_CODE: ${{ needs.playwright.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
          MAIL_TO: bigwhalesllc@gmail.com
          MAIL_USERNAME: ${{ secrets.NIGHTLY_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.NIGHTLY_MAIL_PASSWORD }}
        run: |
          python3 .github/scripts/nightly_e2e_email.py \
            --playwright artifact/e2e/reports/last-run.json \
            --backend-junit artifact/backend/backend-junit.xml \
            --frontend-junit artifact/frontend/frontend-junit.xml \
            --backend-coverage artifact/backend/backend-coverage.json \
            --frontend-coverage artifact/frontend/frontend-coverage/coverage-summary.json \
            --history history/history.jsonl --append-history --write-record record.json

      # Runs even when the email step failed (e.g. missing secrets), so no night is lost.
      - name: Push the history record
        if: always() && hashFiles('record.json') != ''
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add history.jsonl README.md 2>/dev/null || git add history.jsonl
            git commit -qm "nightly: run ${RUN_NUMBER} (${GITHUB_SHA::7})" || true
            if git push -q origin HEAD:nightly-history; then
              echo "history pushed"; exit 0
            fi
            echo "push rejected, refetching (attempt $attempt)"
            git fetch -q origin nightly-history && git reset -q --hard origin/nightly-history
            cat ../record.json >> history.jsonl
          done
          echo "::warning::history push failed after 3 attempts; tonight's record follows"
          cat ../record.json
