name: Nightly e2e

on:
  schedule:
    # Midnight in Israel. GitHub cron is UTC-only and cannot follow DST, so
    # both candidate hours are scheduled (21:00 UTC in summer, 22:00 UTC in
    # winter) and the `gate` job lets only the one that is 00:xx in
    # Asia/Jerusalem continue; the other is skipped.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    name: Midnight in Israel?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Asia/Jerusalem date +%H)
          echo "Israel time now: $(TZ=Asia/Jerusalem date) (hour=$hour)"
          if [ "$hour" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not midnight in Israel; the other scheduled hour will run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The same backend + frontend jobs that gate every PR (.github/workflows/ci.yml).
  ci:
    name: CI suites
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml

  playwright:
    name: Playwright (all browsers)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      exit_code: ${{ steps.e2e.outputs.exit_code }}
    defaults:
      run:
        working-directory: frontend
    # The FastAPI server Playwright talks to (e2e/backend/serve_throwaway.py)
    # runs on the same throwaway PostgreSQL as the backend tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brrrr_test
          POSTGRES_PASSWORD: brrrr_test
          POSTGRES_DB: brrrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brrrr_test -d brrrr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The suite's webServer starts the real FastAPI app on a throwaway
      # SQLite file (e2e/backend/serve_throwaway.py), so the backend deps
      # have to be installed on the runner too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BackEnd/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../BackEnd/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # chromium covers the chromium / Mobile Chrome / chromium-motion
      # projects; webkit covers webkit / Mobile Safari. --with-deps pulls the
      # Linux system libraries WebKit needs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The exit code is recorded for the email, then re-raised so the job
      # still fails on any failing test.
      - name: Run Playwright
        id: e2e
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://brrrr_test:brrrr_test@localhost:5432/brrrr_test
        run: |
          set +e
          npm run e2e
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            frontend/playwright-report
            frontend/e2e/reports/last-run.json
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Sent from the runner over Gmail SMTP once every job above has finished,
  # pass or fail. Needs two repository secrets: NIGHTLY_MAIL_USERNAME (the
  # Gmail address) and NIGHTLY_MAIL_PASSWORD (a Gmail app password for it).
  notify:
    name: Email the result
    needs: [gate, ci, playwright]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Absent when the Playwright job died before producing anything; the
      # script then reports that instead of the per-browser counts.
      - name: Download the Playwright JSON report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ github.run_number }}
          path: artifact

      - name: Send the email
        env:
          CI_OUTCOME: ${{ needs.ci.result }}
          BACKEND_OUTCOME: ${{ needs.ci.outputs.backend_result }}
          FRONTEND_OUTCOME: ${{ needs.ci.outputs.frontend_result }}
          E2E_OUTCOME: ${{ needs.playwright.result }}
          E2E_EXIT_CODE: ${{ needs.playwright.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_TO: bigwhalesllc@gmail.com
          MAIL_USERNAME: ${{ secrets.NIGHTLY_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.NIGHTLY_MAIL_PASSWORD }}
        run: python3 .github/scripts/nightly_e2e_email.py artifact/e2e/reports/last-run.json
